<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050d22" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="canonical" href="https://stevesdiary.github.io/" />
    <title>Redirecting — Stephen Oyeyemi</title>

    <!-- Sends stale links (e.g. the old /stephenoyeyemi/ path) to the site root.
         replace() rather than assign() so the dead URL leaves no history entry
         and the back button still works. -->
    <script>
      location.replace("/" + location.hash);
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/" />
    </noscript>

    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background-color: #050d22;
        color: #f1f4f9;
        font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        text-align: center;
      }
      p { margin: 0 0 1.25rem; color: #93a1bd; line-height: 1.6; }
      a {
        color: #050d22;
        background: #f1f4f9;
        text-decoration: none;
        font-weight: 500;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        display: inline-block;
      }
      a:focus-visible { outline: 2px solid #f1f4f9; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>That page has moved.</p>
      <a href="/">Go to the homepage</a>
    </main>
  </body>
</html>
